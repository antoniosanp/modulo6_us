<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Listado de venues</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions, .pagination { margin-top: 20px; }
        .actions a, .pagination a { margin-right: 10px; }
        .empty-state { color: #666; font-style: italic; margin-top: 20px; }
    </style>
</head>
<body>
<h1 th:text="${title}">Listado de venues</h1>

<div class="actions">
    <a th:href="@{/ui}">Volver al inicio</a>
    <a th:href="@{/ui/venues/new}">Nuevo venue</a>
</div>

<div th:if="${page.isEmpty()}" class="empty-state">
    No hay venues registrados.
</div>

<table th:unless="${page.isEmpty()}">
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Ciudad</th>
        <th>Direccion</th>
        <th>Capacidad maxima</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="venue : ${page.content}">
        <td th:text="${venue.name}">Venue</td>
        <td th:text="${venue.city}">Ciudad</td>
        <td th:text="${venue.address}">Direccion</td>
        <td th:text="${venue.maxCapacity}">100</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${page.totalPages > 1}">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/ui/venues(page=${page.number - 1}, size=${page.size})}">
        Anterior
    </a>

    <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
        <a th:if="${i != page.number}"
           th:href="@{/ui/venues(page=${i}, size=${page.size})}"
           th:text="${i + 1}">
            1
        </a>
        <span th:if="${i == page.number}" th:text="${i + 1}">1</span>
    </span>

    <a th:if="${page.hasNext()}"
       th:href="@{/ui/venues(page=${page.number + 1}, size=${page.size})}">
        Siguiente
    </a>
</div>
</body>
</html>
