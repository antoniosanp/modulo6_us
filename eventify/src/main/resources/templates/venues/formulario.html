<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Registrar venue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 320px; box-sizing: border-box; }
        .actions { margin-top: 20px; }
        .actions a, .actions button { margin-right: 10px; }
    </style>
</head>
<body>
<h1 th:text="${title}">Registrar venue</h1>

<a th:href="@{/ui}">Volver al inicio</a>

<form th:action="@{/ui/venues}" th:object="${venue}" method="post">
    <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="city">Ciudad</label>
        <input type="text" th:field="*{city}" required>
    </div>

    <div class="form-group">
        <label for="address">Direccion</label>
        <input type="text" th:field="*{address}" required>
    </div>

    <div class="form-group">
        <label for="maxCapacity">Capacidad maxima</label>
        <input type="number" min="0" th:field="*{maxCapacity}" required>
    </div>

    <div class="actions">
        <button type="submit">Guardar</button>
        <a th:href="@{/ui/venues}">Ver venues</a>
    </div>
</form>
</body>
</html>
