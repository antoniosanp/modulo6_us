<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Registrar evento</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 8px; width: 320px; box-sizing: border-box; }
        .checkboxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 640px; }
        .checkboxes label { display: flex; align-items: center; gap: 8px; font-weight: normal; }
        .actions { margin-top: 20px; }
        .actions a, .actions button { margin-right: 10px; }
    </style>
</head>
<body>
<h1 th:text="${title}">Registrar evento</h1>

<a th:href="@{/ui}">Volver al inicio</a>

<form th:action="@{/ui/events}" th:object="${event}" method="post">
    <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="eventDate">Fecha</label>
        <input type="date" th:field="*{eventDate}" required>
    </div>

    <div class="form-group">
        <label for="description">Descripcion</label>
        <input type="text" th:field="*{description}" required>
    </div>

    <div class="form-group">
        <label for="venueId">Venue</label>
        <select id="venueId" th:field="*{venueId}" required>
            <option value="">Selecciona una sede</option>
            <option th:each="venue : ${venues}"
                    th:value="${venue.id}"
                    th:text="${venue.name + ' - ' + venue.city}">
                Venue
            </option>
        </select>
    </div>

    <div class="form-group">
        <label>Categorias</label>
        <div class="checkboxes">
            <label th:each="category : ${categories}">
                <input type="checkbox" th:field="*{categoryIds}" th:value="${category.id}">
                <span th:text="${category.name}">Categoria</span>
            </label>
        </div>
    </div>

    <div class="actions">
        <button type="submit">Guardar</button>
        <a th:href="@{/ui/events}">Ver eventos</a>
    </div>
</form>
</body>
</html>
