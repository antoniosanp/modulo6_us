<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPantalla}">Formulario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 300px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .btn-cancel { background-color: #f44336; text-decoration: none; display: inline-block; padding: 10px 15px; color: white; }
    </style>
</head>
<body>

<h1 th:text="${tituloPantalla}">Nuevo evento</h1>

<!-- El formulario se vincula al objeto 'evento' enviado desde el controlador -->
<form th:action="@{/eventos/guardar}" th:object="${evento}" method="post">

    <div class="form-group">
        <label for="name">Nombre del evento:</label>
        <!-- th:field se encarga del id, name y value -->
        <input type="text" th:field="*{name}" required />
    </div>

    <div class="form-group">
        <label for="eventDate">fecha del evento:</label>
        <input type="date" th:field="*{eventDate}" required />
    </div>

    <div class="form-group">
        <label for="description">Descripción:</label>
        <input type="text" th:field="*{description}" required />
    </div>



    <button type="submit">Guardar Evento</button>
    <!-- th:href genera rutas relativas al contexto de la app -->
    <a th:href="@{/admin/libros}" class="btn-cancel">Cancelar</a>

</form>

</body>
</html>
