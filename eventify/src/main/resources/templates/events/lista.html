<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Listado de eventos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .toolbar, .filters, .pagination { margin-top: 20px; }
        .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .field label { display: block; font-weight: 600; margin-bottom: 4px; }
        .field input { width: 100%; padding: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .empty-state { color: #666; font-style: italic; margin-top: 20px; }
        .pagination a, .toolbar a { margin-right: 10px; }
    </style>
</head>
<body>
<h1 th:text="${title}">Listado de eventos</h1>

<div class="toolbar">
    <a th:href="@{/ui}">Volver al inicio</a>
    <a th:href="@{/ui/events/new}">Nuevo evento</a>
</div>

<form class="filters" th:action="@{/ui/events}" method="get">
    <div class="field">
        <label for="city">Ciudad</label>
        <input id="city" name="city" type="text" th:value="${city}" placeholder="Bogota">
    </div>
    <div class="field">
        <label for="category">Categoria</label>
        <input id="category" name="category" type="text" th:value="${category}" placeholder="Rock">
    </div>
    <div class="field">
        <label for="minCapacity">Capacidad minima</label>
        <input id="minCapacity" name="minCapacity" type="number" min="0" th:value="${minCapacity}">
    </div>
    <div class="field">
        <label for="fromDate">Desde</label>
        <input id="fromDate" name="fromDate" type="date" th:value="${fromDate}">
    </div>
    <div class="field">
        <label for="toDate">Hasta</label>
        <input id="toDate" name="toDate" type="date" th:value="${toDate}">
    </div>
    <div class="field" style="align-self: end;">
        <button type="submit">Buscar</button>
    </div>
</form>

<div th:if="${slice.isEmpty()}" class="empty-state">
    No hay eventos registrados para los filtros actuales.
</div>

<table th:unless="${slice.isEmpty()}">
    <thead>
    <tr>
        <th>Evento</th>
        <th>Fecha</th>
        <th>Venue</th>
        <th>Ciudad</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${slice.content}">
        <td th:text="${event.eventName}">Evento</td>
        <td th:text="${event.eventDate}">2026-01-15</td>
        <td th:text="${event.venueName}">Venue</td>
        <td th:text="${event.city}">Bogota</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${slice.hasPrevious() or slice.hasNext()}">
    <a th:if="${slice.hasPrevious()}"
       th:href="@{/ui/events(page=${slice.number - 1}, size=${slice.size}, city=${city}, category=${category}, minCapacity=${minCapacity}, fromDate=${fromDate}, toDate=${toDate})}">
        Anterior
    </a>
    <span th:text="${slice.number + 1}">1</span>
    <a th:if="${slice.hasNext()}"
       th:href="@{/ui/events(page=${slice.number + 1}, size=${slice.size}, city=${city}, category=${category}, minCapacity=${minCapacity}, fromDate=${fromDate}, toDate=${toDate})}">
        Siguiente
    </a>
</div>
</body>
</html>
